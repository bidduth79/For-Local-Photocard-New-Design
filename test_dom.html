<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    width: 400px;
    height: 400px;
    border: 1px solid red;
    overflow: hidden;
    position: relative;
  }
  .image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 100% 50%;
    transform: scale(2);
    transform-origin: 50% 50%;
    background-color: blue; /* Just to see it */
  }
</style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/800x400" class="image" id="img" />
  </div>
  <script>
    window.onload = () => {
      const img = document.getElementById('img');
      const rect = img.getBoundingClientRect();
      console.log('rect:', rect);
    };
  </script>
</body>
</html>
